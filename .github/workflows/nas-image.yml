# Builds the image this fork deploys, straight to the fork's own container registry.
# Upstream's docker-release.yml only runs on master and needs Docker Hub credentials.
name: 'NAS image'

on:
    push:
        branches:
            - fix/patreon-flaresolverr
        paths:
            - '.github/workflows/nas-image.yml'
            - 'lib/**'
            - '!lib/**/*.test.ts'
            - 'Dockerfile'
            - 'package.json'
            - 'pnpm-lock.yaml'
    workflow_dispatch: {}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v5

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  # TrueNAS SCALE is x86-64 only; add linux/arm64 here if that ever changes.
                  platforms: linux/amd64
                  push: true
                  tags: ghcr.io/${{ github.repository_owner }}/rsshub:patreon-flaresolverr
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
